# Expected differences between deckcraft-pptx before (3e178d8f5) and after (168d5da7) the
# craft-ooxml swap (#122). Verified by artcraft-algorithms#184; narrative and root causes in
# docs/verification/ooxml-oracle.md. Every entry names the code that causes it.

[[expected]]
id = "ooxml-package-layout"
reason = """The writer in craft-ooxml emits parts and relationships in its own canonical order and picks
Default (by extension) over per-part Override when every part of an extension shares a type:
entry order is sorted with [Content_Types].xml first, Relationship elements are sorted by Id as
a string (rId10 before rId2), kept-part relationship lists therefore re-read in that order.
OPC treats parts and relationships as unordered sets keyed by name / Id; the judge has already
checked that the part set, every part body, every relationship (Id, Type, Target, TargetMode)
and the effective content type of every part are equal, so only order and declaration style differ."""
evidence = "craft-libs b78f88e crates/ooxml/src/opc.rs: PackageWriter parts/rels BTreeMap, rels.sort_by Id (l.567), PartOrder::Sorted (l.591), Default inference (l.490-505); OPC ECMA-376 Part 2 sections 9.3 and 10"
metric = "package_layout"

[[expected]]
id = "zip-entry-cap-fails-package"
reason = """A zip entry whose declared size exceeds the 512 MiB per-part cap. The caps are the same in both
readers (old MAX_PART 512 MiB, MAX_TOTAL 2 GiB, MAX_ENTRIES 50 000; new OpcLimits set to the same
values), so the same part is refused. The old reader skipped that one part and opened the rest; the
craft-archive ZipGuard treats a limit breach as a hard error (`ZIP entry exceeds byte limit`) and
fails the package, even under Tolerance::lenient (only corrupt or unreadable entries are skipped).
Kept as a security limit: a package that declares an over-cap entry is refused, not partly read."""
evidence = "deckcraft 3e178d8f5 crates/pptx/src/opc.rs MAX_PART/MAX_TOTAL/MAX_ENTRIES; craft-libs 7d46713 crates/archive/src/zip_guard.rs l.100 (entry.size() > max_entry_bytes) and crates/ooxml/src/opc.rs open_with (only ZipError::Archive/Io are skipped)"
glob = "synthetic/oversized_part*"
